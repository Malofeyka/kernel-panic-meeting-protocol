[project]
name = "kernel-panic-meeting-protocol"
version = "0.1.0"
description = "ИИ система для протоколирования совещаний Министерства образования Свердловской области"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "docxtpl>=0.16.8",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "huggingface-hub>=0.30.0",
    "gigaam",
    "numba>=0.62",
    "pyannote.audio==4.0.*",
    "pyarrow>=23",
    "torch==2.9.0",
    "torchaudio==2.9.0",
    "torchcodec==0.9.1",
    "transformers==5.*",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
gigaam = { git = "https://github.com/salute-developers/GigaAM.git", rev = "7447938d791c4f3e643386ee22c33777004293a5" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "."
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["backend"]
omit = [
    "tests/*",
    "backend/app/main.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
