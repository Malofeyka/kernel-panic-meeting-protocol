name: CI Quality Gate (Linters, Types & Tests)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint, Type Check & Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies via uv
        run: |
          uv pip install -e ".[dev]"

      - name: Run Ruff Linting & Formatting Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run MyPy Static Type Check
        run: |
          uv run mypy backend

      - name: Run Pytest with Coverage Gate (>= 80%)
        run: |
          uv run pytest --cov=backend --cov-report=term-missing --cov-fail-under=80
