schema: spec-driven
context: |
  Проект: "Агент: ИИ система для протоколирования совещаний Министерства образования Свердловской области"
  Целевая платформа: Автономная рабочая станция в защищённом локальном контуре (без передачи во внешние облака)
  Основной стек:
    - Backend: Python 3.11+, FastAPI, Pydantic v2, python-docx / docxtpl
    - ML / NLP: Российская LLM (GigaChat On-Prem / локальный инференс Saiga/Vikhr/T-lite через vLLM/llama.cpp), Faster-Whisper / GigaAM для распознавания русской речи (STT)
    - Frontend: React / Vite + Tailwind CSS / Shadcn UI (веб-интерфейс визуального редактирования)
    - Хранилище: Локальное SQLite / JSON storage для сессий протоколирования, файловая система для аудио и документов
rules:
  proposal:
    - Чётко определять границы системы (In Scope / Out of Scope) согласно регламентам Министерства
    - Учитывать требования импортозамещения и запрета на передачу данных в облака
    - Фиксировать критерии приёмки и ограничения по числу кругов правок (<= 2)
  specs:
    - Использовать нормативные требования (SHALL, MUST, SHOULD)
    - Описывать сценарии в BDD-стиле (GIVEN / WHEN / THEN)
    - Обязательно покрывать обработку исключений и неполных данных (отсутствие сроков, неясный ответственный)
  tasks:
    - Декомпозировать задачи с привязкой к ролям команды (5 участников)
    - Указывать Definition of Done (DoD) для каждой задачи
operations:
  apply:
    guidance:
      - Проверять работу пайплайнов на тестовых стенограммах без внешнего сетевого доступа
  archive:
    guidance:
      - Синхронизировать дельты требований в базовые спецификации openspec/specs
